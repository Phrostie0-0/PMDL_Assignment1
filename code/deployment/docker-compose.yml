name: exoplanet-mass-lab

services:
  api:
    build:
      context: ../..
      dockerfile: code/deployment/api/Dockerfile
    image: exoplanet-mass-api:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ../..
      dockerfile: code/deployment/app/Dockerfile
    image: exoplanet-mass-app:latest
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

